<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'sha256-bMe+RX+0x9e7snl1dyplKMwT54Uy7DRDWKU+TGuymfo='; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<title>Página no encontrada — Sánchez &amp; Sánchez</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FEFCF9;
  --bg-warm: #F8F4EE;
  --surface: #FFFFFF;
  --fg: #1A1816;
  --fg-light: #FEFCF9;
  --fg-muted: #6F6B66;
  --border: #E9E4DC;
  --accent: #BF4A2B;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --radius-md: 8px;
}
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1.25rem;
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
.nf { max-width: 480px; }
.nf__code {
  font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem;
}
.nf__title {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 6vw, 2.5rem);
  line-height: 1.15; margin-bottom: 0.75rem;
}
.nf__text { color: var(--fg-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
.nf__actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0.875rem 1.5rem; min-height: 48px;
  font-size: 0.875rem; font-weight: 600;
  text-decoration: none; border-radius: var(--radius-md);
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.btn--primary { background: var(--fg); color: var(--fg-light); border: 2px solid var(--fg); }
.btn--primary:hover { background: var(--accent); border-color: var(--accent); }
.btn--outline { background: transparent; color: var(--fg); border: 2px solid var(--border); }
.btn--outline:hover { border-color: var(--fg); background: var(--bg-warm); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="nf">
    <p class="nf__code">Error 404</p>
    <h1 class="nf__title">No encontramos esta página</h1>
    <p class="nf__text">Puede que el enlace esté viejo o mal escrito. Te dejamos por dónde seguir:</p>
    <div class="nf__actions">
      <a class="btn btn--primary" href="/">Ir al inicio</a>
      <a class="btn btn--outline" href="/carta/">Ver la carta</a>
      <a class="btn btn--outline" href="/cafeteria/">Cafetería</a>
    </div>
  </main>
</body>
</html>
