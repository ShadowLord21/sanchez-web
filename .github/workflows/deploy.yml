name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publica SOLO la web. Todo lo interno (docs/, testsprite_tests/,
      # .claude/, .github/) queda fuera del sitio desplegado.
      - name: Armar el artefacto solo con los archivos publicos
        run: |
          mkdir -p _site
          cp -r assets carta cafeteria _site/
          cp index.html 404.html robots.txt sitemap.xml CNAME .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
